version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: aquatic_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aquatic_intelligent
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: aquatic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: aquatic_backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: aquatic_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app

volumes:
  mongodb_data:
